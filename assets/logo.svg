<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="esOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7700" />
      <stop offset="50%" stop-color="#ff5500" />
      <stop offset="100%" stop-color="#ff3300" />
    </linearGradient>
    <linearGradient id="esDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
    <filter id="esGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Cyber Hexagon Outer Border -->
  <polygon points="50,5 91,27 91,73 50,95 9,73 9,27" fill="url(#esDark)" stroke="url(#esOrange)" stroke-width="2.5"/>
  <polygon points="50,11 85,30 85,70 50,89 15,70 15,30" stroke="#ff5500" stroke-width="0.8" stroke-dasharray="4,3" stroke-opacity="0.45"/>
  
  <!-- Stylized Monogram "E" -->
  <path d="M26 31 H46 V37 H34 V46 H43 V52 H34 V63 H46 V69 H26 Z" fill="url(#esOrange)" filter="url(#esGlow)"/>
  
  <!-- Stylized Monogram "S" -->
  <path d="M53 31 H73 V43 H61 V46 H73 V69 H53 V57 H65 V54 H53 Z" fill="url(#esOrange)" filter="url(#esGlow)"/>
  
  <!-- Corner Tech Accents -->
  <circle cx="50" cy="5" r="2.5" fill="#ff7700"/>
  <circle cx="50" cy="95" r="2.5" fill="#ff7700"/>
  <line x1="49" y1="31" x2="49" y2="69" stroke="#ff5500" stroke-width="1.5" stroke-dasharray="3,3" stroke-opacity="0.35"/>
</svg>
